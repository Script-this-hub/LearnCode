<section class="section">
<div class="contact-card">
    <h2>Request a Consultation</h2>
    <p>Tell us about your project and we'll get back to you shortly.</p>

    <form action="https://formspree.io/f/xaeezqkl" method="POST">

        <input
            type="text"
            name="First Name"
            placeholder="First Name"
            required>

        <input
            type="text"
            name="Last Name"
            placeholder="Last Name"
            required>

        <input
            type="email"
            name="Email"
            placeholder="Email Address"
            required>

        <textarea
            name="Project Description"
            placeholder="Describe your project, business process, or automation needs..."
            rows="6"
            required></textarea>

        <button type="submit">
            Request Consultation
        </button>

    </form>
</div>
